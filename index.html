<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도로교통법규 기출 모의고사 v2</title>
<style>
:root{--pri:#16a34a;--pri-d:#15803d;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--ok:#16a34a;--no:#dc2626;--mut:#64748b;--ink:#0f172a;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:80px;}
header{background:linear-gradient(135deg,#16a34a,#166534);color:#fff;padding:18px 20px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.1);isolation:isolate;}
header h1{font-size:18px;font-weight:800;}
header .sub{font-size:12px;opacity:.85;margin-top:2px;}
.role{position:absolute;right:16px;top:16px;font-size:11px;background:rgba(255,255,255,.2);padding:5px 10px;border-radius:20px;cursor:pointer;border:1px solid rgba(255,255,255,.3);z-index:60;color:#fff;}
.resetbar{background:#fef9c3;border-bottom:1px solid #fde047;padding:8px 16px;font-size:12px;color:#854d0e;display:flex;justify-content:space-between;align-items:center;gap:10px;}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:40;overflow-x:auto;}
nav button{flex:1;min-width:74px;padding:13px 6px;border:none;background:none;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
nav button.on{color:var(--pri);border-bottom-color:var(--pri);}
.wrap{padding:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.card h3{font-size:15px;margin-bottom:8px;}
.card.cat{cursor:pointer;transition:.15s;}
.card.cat:hover{border-color:#93c5fd;box-shadow:0 3px 10px rgba(0,0,0,.08);}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
select,input,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);}
select{flex:1;min-width:120px;}
textarea{width:100%;resize:vertical;line-height:1.5;}
.btn{background:var(--pri);color:#fff;border:none;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
.btn:active{background:var(--pri-d);}
.btn.sec{background:#e2e8f0;color:#334155;}
.btn.dang{background:#fee2e2;color:#b91c1c;}
.btn.ok{background:var(--ok);}
.btn.sm{padding:7px 12px;font-size:12px;}
.btn.full{width:100%;}
.btn.tiny{padding:4px 9px;font-size:11px;}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:#eff6ff;color:#1d4ed8;margin-right:5px;font-weight:600;}
.pill.g{background:#f0fdf4;color:#15803d;}
.pill.o{background:#fff7ed;color:#c2410c;}
.pill.p{background:#faf5ff;color:#7e22ce;}
.pill.c{background:#ecfeff;color:#0e7490;}
.pill.x{background:#f1f5f9;color:#64748b;}
.stars{color:#f59e0b;letter-spacing:1px;}
.qmeta{font-size:11px;color:var(--mut);margin-bottom:6px;}
.qtext{font-size:14.5px;font-weight:600;white-space:pre-wrap;margin-bottom:12px;}
.qimg{max-width:100%;border:1px solid var(--line);border-radius:10px;margin:6px 0 12px;display:block;}
.choice{display:block;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer;font-size:14px;background:#fff;}
.choice:hover{border-color:#93c5fd;}
.choice.sel{border-color:var(--pri);background:#f0fdf4;}
.exp{background:#f8fafc;border-left:3px solid var(--pri);padding:11px 13px;border-radius:0 8px 8px 0;font-size:13px;margin-top:10px;white-space:pre-wrap;color:#334155;}
.exp img{max-width:100%;border-radius:8px;margin-top:8px;display:block;border:1px solid var(--line);}
.review{background:#fffbeb;border:1px dashed #f59e0b;color:#92400e;font-size:12px;padding:9px 12px;border-radius:8px;margin-top:8px;}
.bar{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:6px 0;}
.bar > i{display:block;height:100%;background:var(--pri);}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.big{font-size:30px;font-weight:800;color:var(--pri);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
.stat-box .v{font-size:24px;font-weight:800;color:var(--pri);}
.stat-box .l{font-size:11px;color:var(--mut);margin-top:2px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;}
th{background:#f8fafc;font-size:12px;color:#475569;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal.on{display:flex;}
.modal .box{background:#fff;border-radius:16px;padding:20px;max-width:620px;width:100%;max-height:90vh;overflow:auto;}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px;}
.fld input,.fld textarea,.fld select{width:100%;}
.muted{color:var(--mut);font-size:13px;}
.imgbox{border:2px dashed #94a3b8;border-radius:10px;padding:14px;text-align:center;background:#f8fafc;}
.imgbox img{max-width:100%;max-height:200px;border-radius:8px;margin:0 auto 10px;display:block;}
.imgbox input[type=file]{display:block;width:100%;margin:6px auto;font-size:13px;}
.note{font-size:12px;color:var(--mut);background:#f8fafc;padding:10px;border-radius:8px;}
.code{font-family:monospace;font-size:12px;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;white-space:pre;overflow-x:auto;}
.progress-top{height:5px;background:#e2e8f0;}
.progress-top > i{display:block;height:100%;background:var(--ok);transition:.3s;}
.center{text-align:center;}
.cnum{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#f1f5f9;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:8px;color:#475569;}
.tags{display:flex;flex-wrap:wrap;gap:4px;}
.draghandle{cursor:grab;touch-action:none;padding:2px 8px;margin-right:2px;color:var(--mut);font-size:16px;user-select:none;line-height:1;}
.draghandle:active{cursor:grabbing;}
.card.cat{user-select:none;}
.card.cat.dragging{opacity:.55;box-shadow:0 10px 24px rgba(0,0,0,.18);}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🚦 도로교통법규 기출 모의고사</h1>
  <div class="sub">도로교통법규 기출문제 모음 · v2</div>
  <button class="role" id="roleBtn" onclick="toggleRole()"></button>
</header>
<div class="resetbar" id="resetbar" style="display:none">
  <span>⚙ 이전 버전을 열었던 적이 있다면 → </span>
  <button class="btn tiny dang" onclick="hardReset()">🔄 데이터 새로고침</button>
</div>
<nav id="nav"></nav>
<div class="wrap" id="view"></div>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
const DATA = [];
const ADMIN_PW = "guseo1707!";
const STAR=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const $=s=>document.querySelector(s);

// 5개 카테고리 정의
const CATS=[
  {id:'1',name:'지역 기출 유사문제',icon:'📍',type:'mc',desc:'지역·연도·난이도를 골라 지역 기출 유사문제를 풉니다.'},
  {id:'2',name:'전 범위 기출변형 O/X',icon:'⭕',type:'ox',desc:'난이도와 문제 수만 선택하면 O/X 문제가 출제됩니다.'},
  {id:'3',name:'각 단원별 주관식 단답형 문제',icon:'✍️',type:'short',desc:'Chapter를 하나 고르면 그 챕터의 문제를 전부 풉니다.'},
  {id:'4',name:'실전모의고사',icon:'📝',type:'mc',desc:'회차(1~10회)를 선택해 실전모의고사를 풉니다.'},
  {id:'5',name:'23-25 기출문제',icon:'📅',type:'mc',desc:'연도·지역을 골라 2023~2025년 기출문제를 추가된 순서대로 풉니다.'},
  {id:'6',name:'2027년 기본서 기출 및 예상문제',icon:'📘',type:'mc',desc:'챕터(1~13장)를 선택해 2027년 기본서 기출 및 예상문제를 풉니다.'}
];

// ===== 목차(학습유형)별 공개/비공개 상태 =====
// 값이 없으면(=한 번도 설정한 적 없으면) 기본적으로 공개(true)로 취급한다.
// 비공개로 바꿔도 DB 안의 문제 데이터 자체는 전혀 건드리지 않으므로 문제는 그대로 보관된다.
let CAT_VIS = {};
try{ CAT_VIS = JSON.parse(localStorage.getItem('catvis_traffic_v1')||'{}') || {}; }catch(e){ CAT_VIS = {}; }
function isCatVisible(id){ return CAT_VIS[String(id)] !== false; }
function saveCatVis(){
  try{ localStorage.setItem('catvis_traffic_v1', JSON.stringify(CAT_VIS)); }
  catch(e){ console.error('공개/비공개 설정 저장 실패:', e); }
}
function toggleCatVis(id){
  id = String(id);
  CAT_VIS[id] = !isCatVisible(id);
  saveCatVis();
  render();
}

// ===== 목차(학습유형) 표시 순서 =====
// 관리자가 드래그로 바꾼 순서를 저장한다. 저장된 값이 없으면 CATS 배열의 기본 순서를 사용한다.
let CAT_ORDER = [];
try{ CAT_ORDER = JSON.parse(localStorage.getItem('catorder_traffic_v1')||'[]'); }catch(e){ CAT_ORDER = []; }
function saveCatOrder(){
  try{ localStorage.setItem('catorder_traffic_v1', JSON.stringify(CAT_ORDER)); }
  catch(e){ console.error('카테고리 순서 저장 실패:', e); }
}
function getOrderedCats(){
  const ids = CATS.map(c=>c.id);
  let order = CAT_ORDER.filter(id=>ids.includes(id));
  ids.forEach(id=>{ if(!order.includes(id)) order.push(id); });
  if(order.join(',') !== CAT_ORDER.join(',')){ CAT_ORDER = order; saveCatOrder(); }
  return order.map(id=>CATS.find(c=>c.id===id));
}

// ===== 영구 저장소(IndexedDB) =====
// 문제 데이터(DB)는 이미지가 쌓이면 용량이 커져서, localStorage(브라우저마다 대략 5~10MB 한도)에
// 저장할 경우 한도를 넘는 순간 저장이 "조용히" 실패해 다음 접속 때 새로 추가한 문제가 사라지는
// 문제가 있었다. 이를 막기 위해 문제 데이터는 한도가 훨씬 큰 IndexedDB에 저장하도록 변경한다.
const IDB_NAME='traffic_quiz_store', IDB_STORE='kv';
let _idbPromise=null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('indexedDB 미지원 브라우저'));return;}
    const req = indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _idbPromise;
}
function idbGet(key){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    const req = db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  }));
}
function idbSet(key,val){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    const req = db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(val,key);
    req.onsuccess = ()=>resolve(true);
    req.onerror = ()=>reject(req.error);
  }));
}
function idbDel(key){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    const req = db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).delete(key);
    req.onsuccess = ()=>resolve(true);
    req.onerror = ()=>reject(req.error);
  }));
}

let DB = [];               // 실제 값은 loadQuestions()에서 채워짐 (IndexedDB → 구버전 localStorage → 초기 파일 순으로 확인)
let ROLE = localStorage.getItem('role_traffic_v1')||'user';
let HIST = JSON.parse(localStorage.getItem('hist_traffic_v1')||'[]');
function saveDB(){
  return idbSet('qdb_traffic_v1', DB).catch(err=>{
    console.error('IndexedDB 저장 실패, localStorage로 대신 저장을 시도합니다:', err);
    try{
      localStorage.setItem('qdb_traffic_v1', JSON.stringify(DB));
    }catch(err2){
      console.error('localStorage 저장도 실패:', err2);
      alert('⚠ 문제 데이터를 저장하지 못했습니다!\n저장 공간이 부족하거나 브라우저 문제일 수 있습니다.\n지금 바로 [문제관리] > [내보내기(JSON)]로 백업해 두시고, 용량이 큰 이미지를 정리해주세요.');
    }
  });
}
function saveHist(){
  try{ localStorage.setItem('hist_traffic_v1',JSON.stringify(HIST)); }
  catch(e){ console.error('이력 저장 실패:', e); }
}

// Chapter 1~13 고정 목록/제목 (주관식 단답형=카테고리3, 2027년 기본서 기출 및 예상문제=카테고리6 공용)
const CHAPTER_TITLES={
  '1':'총칙',
  '2':'보행자의 통행방법',
  '3':'차마 및 노면전차의 통행방법 등',
  '4':'운전자 및 고용주 등의 의무',
  '5':'고속도로 및 자동차전용도로에서의 특례',
  '6':'도로의 사용',
  '7':'교통안전교육',
  '8':'운전면허',
  '9':'국제운전면허증',
  '10':'운전면허의 행정처분',
  '11':'보칙',
  '12':'벌칙',
  '13':'범칙행위의 처리에 관한 특례'
};
function chapterLabel(n){return CHAPTER_TITLES[String(n)]||'';}
function chapterFullLabel(n){return `Chapter.${n} [ ${chapterLabel(n)} ]`;}
// 카테고리6(2027년 기본서 기출 및 예상문제)용 챕터 타이틀 표기: "Chapter 01. 총칙" 형식
function chapterTitleFmt(n){return `Chapter ${padNum(n)}. ${chapterLabel(n)}`;}
// 카테고리3(주관식) 문제가 해당 챕터 안에서 몇 번째로 추가되었는지(문제01, 문제02...) 계산.
// "문제 NN" 라벨 값이 아니라 실제 추가된 순서(id 오름차순)를 기준으로 한다.
function chapterQNumber(q){
  if(!q||q.category!=='3'||!q.chapter)return null;
  const list=DB.filter(x=>x.category==='3'&&String(x.chapter)===String(q.chapter)).sort((a,b)=>a.id-b.id);
  const idx=list.findIndex(x=>x.id===q.id);
  return idx>=0?idx+1:null;
}
function padNum(n){return String(n).padStart(2,'0');}
// 카테고리4(실전모의고사) 문제가 해당 회차 안에서 몇 번째로 추가되었는지("문제 01, 02...") 계산.
// 카테고리3의 chapterQNumber와 동일한 방식(실제 추가 순서=id 오름차순 기준).
function roundQNumber(q){
  if(!q||q.category!=='4'||!q.round)return null;
  const list=DB.filter(x=>x.category==='4'&&String(x.round)===String(q.round)).sort((a,b)=>a.id-b.id);
  const idx=list.findIndex(x=>x.id===q.id);
  return idx>=0?idx+1:null;
}
// 카테고리6(2027년 기본서 기출 및 예상문제) 문제가 해당 챕터 안에서 몇 번째로 추가되었는지 계산.
// roundQNumber/chapterQNumber와 동일한 방식(실제 추가 순서=id 오름차순 기준).
function cat6QNumber(q){
  if(!q||q.category!=='6'||!q.chapter)return null;
  const list=DB.filter(x=>x.category==='6'&&String(x.chapter)===String(q.chapter)).sort((a,b)=>a.id-b.id);
  const idx=list.findIndex(x=>x.id===q.id);
  return idx>=0?idx+1:null;
}
// 카테고리5(23-25 기출문제) 문제 번호: 같은 "출제년도+출제지역" 조합(=하나의 기출문제 회차)
// 안에서 추가된 순서(id 오름차순) 기준으로 매번 1번부터 새로 매긴다. 연도·지역이 다르면 다른 회차로 취급.
function cat5GroupKey(q){return (q.year||'')+'||'+(q.region||'');}
function cat5QNumber(q){
  if(!q||q.category!=='5')return null;
  const key=cat5GroupKey(q);
  const list=DB.filter(x=>x.category==='5'&&cat5GroupKey(x)===key).sort((a,b)=>a.id-b.id);
  const idx=list.findIndex(x=>x.id===q.id);
  return idx>=0?idx+1:null;
}

// 기존에 저장된 문제(카테고리 정보가 없는 문제)는 모두 "1. 지역 기출 유사문제"로 편입
function migrateDB(){
  let changed=false;
  DB.forEach(q=>{
    if(!q.category){q.category='1';changed=true;}
    if(!q.type){q.type = q.category==='2'?'ox' : q.category==='3'?'short' : 'mc';changed=true;}
    if(q.type==='mc'&&!q.choices)q.choices=['','','',''];
    // 실전모의고사(카테고리4): 회차/출제지수/출제난도/출제파트 필드 보정 (구버전 지역·연도 데이터에서 이관)
    if(q.category==='4'){
      if(!q.round){q.round='1';changed=true;}
      if(q.exIndex==null){q.exIndex=q.freq||2;changed=true;}
      if(q.exDiff==null){q.exDiff=q.freq||2;changed=true;}
      if(q.part==null){q.part='';changed=true;}
    }
    // 2027년 기본서 기출 및 예상문제(카테고리6): 챕터/출제지수/출제난도/출제파트 필드 보정
    if(q.category==='6'){
      if(!q.chapter){q.chapter='1';changed=true;}
      if(q.exIndex==null){q.exIndex=q.freq||2;changed=true;}
      if(q.exDiff==null){q.exDiff=q.freq||2;changed=true;}
      if(q.part==null){q.part='';changed=true;}
    }
  });
  if(changed)saveDB();
}
// 참고: DB는 이제 loadQuestions()에서 비동기로 채워지므로, migrateDB()도 그 안에서 호출한다.

async function hardReset(){

function normalizeRegion(s){return (s||'').replace(/교육청\s*유사\s*[ⅠⅡⅢⅣⅤ0-9]*/g,'교육청');}
function splitRegions(s){return normalizeRegion(s).split(/[·,\/]|및|\s+/).map(x=>x.trim()).filter(Boolean);}
function splitYears(s){return (String(s||'').match(/20\d{2}/g)||[]);}
function regionOpts(cat){const set=new Set();DB.forEach(q=>{if(cat&&q.category!==cat)return;splitRegions(q.region).forEach(r=>set.add(r));});return [...set].sort();}
function yearOpts(cat){const set=new Set();DB.forEach(q=>{if(cat&&q.category!==cat)return;splitYears(q.year).forEach(y=>set.add(y));});return [...set].sort();}


function peers(setKey){let seed=0;for(const c of setKey)seed=(seed*31+c.charCodeAt(0))%99991;
  const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;};
  const cnt=18+Math.floor(rnd()*40);const arr=[];
  for(let i=0;i<cnt;i++)arr.push(Math.min(100,Math.round(45+rnd()*52)));return arr;}

// ===== 관리자 목록 드래그 정렬 (마우스 + 터치 공용, Pointer Events) =====
function initCatDrag(){
  const container = $('#view');
  if(!container) return;
  container.querySelectorAll('.draghandle').forEach(h=>{
    h.addEventListener('pointerdown', onCatDragStart);
  });
}
function onCatDragStart(e){
  if(e.pointerType==='mouse' && e.button!==0) return;
  e.preventDefault();
  e.stopPropagation();
  const handle = e.currentTarget;
  const card = handle.closest('.card.cat');
  const container = card && card.parentElement;
  if(!card || !container) return;

  let startY = e.clientY;
  card.classList.add('dragging');
  card.style.position='relative';
  card.style.zIndex='10';

  function onMove(ev){
    const dy = ev.clientY - startY;
    card.style.transform = `translateY(${dy}px)`;
    const pointerY = ev.clientY;
    const siblings = Array.from(container.querySelectorAll('.card.cat')).filter(c=>c!==card);
    let target = null;
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      if(pointerY < r.top + r.height/2){ target = sib; break; }
    }
    const curIdx = Array.from(container.children).indexOf(card);
    if(target){
      const targetIdx = Array.from(container.children).indexOf(target);
      if(targetIdx !== curIdx){
        container.insertBefore(card, target);
        startY = ev.clientY;
        card.style.transform = 'translateY(0px)';
      }
    } else if(container.lastElementChild !== card){
      container.appendChild(card);
      startY = ev.clientY;
      card.style.transform = 'translateY(0px)';
    }
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    card.classList.remove('dragging');
    card.style.transform='';
    card.style.position='';
    card.style.zIndex='';
    CAT_ORDER = Array.from(container.querySelectorAll('.card.cat')).map(c=>c.dataset.catId);
    saveCatOrder();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

function regionOptsForYear(year){
  const set=new Set();
  DB.forEach(q=>{

    if(year&&q.year&&!splitYears(q.year).includes(year))return;

}

  exam={type:'mc',cat:'6',qs:pool,i:0,ans:{},start:Date.now()};render();
}

function renderRunningShort(){const {qs,i}=exam;const q=qs[i];

    ? ansArr.map((_,k)=>`<div class="row" style="gap:8px;margin-top:8px;align-items:center">

      </div>`).join('')
    : `<input placeholder="답을 입력하세요" value="${attr(myArr[0]||'')}" oninput="setShortAns(${q.id},0,this.value,1)" style="width:100%;margin-top:6px">`;
  const qNum=chapterQNumber(q);
  const qPrefix=qNum!=null?padNum(qNum)+'. ':'';
  $('#view').innerHTML=`
  <div class="progress-top"><i style="width:${(i+1)/qs.length*100}%"></i></div>

function setShortAns(id,k,val,len){
  if(!Array.isArray(exam.ans[id])||exam.ans[id].length!==len)exam.ans[id]=new Array(len).fill('');
  exam.ans[id][k]=val;
}

function pick(id,k){exam.ans[id]=k;renderRunning();}
function navQ(d){exam.i+=d;render();}

function ansMark(i){return String.fromCodePoint(0x24D0+i);} // ⓐ,ⓑ,ⓒ...
function toAnswerArray(ans){
  if(Array.isArray(ans))return ans.length?ans:[''];
  if(ans==null||ans==='')return [''];
  return [String(ans)];
}
function normText(s){return String(s==null?'':s).trim().replace(/\s+/g,'').toLowerCase();}
// "A 또는 B 또는 C" 형태로 적은 정답칸은 셋 중 어떤 걸 써도 정답으로 인정
function splitAlternatives(s){
  const parts=String(s||'').split(/\s*또는\s*/).map(x=>x.trim()).filter(x=>x.length>0);
  return parts.length?parts:[String(s||'')];
}
function isCorrect(q,my,type){
  if(type==='short'){
    const ansArr=toAnswerArray(q.answer);
    const myArr=Array.isArray(my)?my:(my==null?[]:[my]);
    for(let k=0;k<ansArr.length;k++){
      const alts=splitAlternatives(ansArr[k]);
      if(!alts.some(a=>normText(a)===normText(myArr[k])))return false;
    }
    return true;
  }
  return my===q.answer;
}

function submitExam(){const {qs,ans,type}=exam;let correct=0;
  qs.forEach(q=>{if(isCorrect(q,ans[q.id],type))correct++;});
  const score=Math.round(correct/qs.length*100);const sec=Math.round((Date.now()-exam.start)/1000);
  const setKey=qs.map(q=>q.id).join('-');
  const rec={date:new Date().toLocaleString('ko-KR'),score,correct,total:qs.length,sec,setKey,type,
    detail:qs.map(q=>({id:q.id,my:ans[q.id],ok:q.answer,correct:isCorrect(q,ans[q.id],type)}))};
  HIST.unshift(rec);saveHist();renderResult(rec,qs,type);}

function renderResult(rec,qs,type){type=type||rec.type||'mc';
  const pr=peers(rec.setKey).concat([rec.score]).sort((a,b)=>b-a);
  const avg=Math.round(pr.reduce((a,b)=>a+b,0)/pr.length);const rank=pr.indexOf(rec.score)+1;
  $('#view').innerHTML=`
  <div class="card center"><div class="muted">획득 점수</div><div class="big" style="font-size:46px">${rec.score}점</div>
    <div class="muted">${rec.correct} / ${rec.total} 정답 · 소요 ${Math.floor(rec.sec/60)}분 ${rec.sec%60}초</div></div>
  <div class="stat-grid">
    <div class="stat-box"><div class="v">${pr.length}명</div><div class="l">응시 인원</div></div>
    <div class="stat-box"><div class="v">${avg}점</div><div class="l">평균 점수</div></div>
    <div class="stat-box"><div class="v">${rank}위</div><div class="l">나의 순위</div></div>
    <div class="stat-box"><div class="v">상위 ${Math.round(rank/pr.length*100)}%</div><div class="l">백분위</div></div></div>
  <div class="card"><h3>📋 문항별 결과</h3>
    ${qs.map((q,n)=>{const d=rec.detail.find(x=>x.id===q.id);
      let myLabel,okLabel;
      if(type==='ox'){myLabel=d.my===1?'⭕':d.my===2?'❌':'-';okLabel=q.answer===1?'⭕':'❌';}
      else if(type==='short'){
        const ansArr=toAnswerArray(q.answer);
        const myArr=Array.isArray(d.my)?d.my:(d.my==null?[]:[d.my]);
        myLabel=ansArr.length>1?ansArr.map((_,k)=>ansMark(k)+' '+esc(myArr[k]||'-')).join(', '):esc(myArr[0]||'-');
        // 오답일 때만 정답을 공개하며, "A 또는 B" 처럼 중복 정답이 있으면 첫번째 답만 표시
        const firstAlts=ansArr.map(a=>splitAlternatives(a)[0]);
        okLabel=ansArr.length>1?firstAlts.map((a,k)=>ansMark(k)+' '+esc(a)).join(', '):esc(firstAlts[0]);
      }
      else{myLabel=esc(d.my||'-');okLabel=q.answer+'. '+esc(q.choices[q.answer-1]);}
      const resultStars=(type!=='short')?((q.category==='4'||q.category==='6')?`<span class="stars" title="출제지수">${STAR(q.exIndex)}</span> <span class="stars" title="출제난도">${STAR(q.exDiff)}</span>`:(q.category==='5'?'':`<span class="stars">${STAR(q.freq)}</span>`)):'';
      const roundBadge=(q.category==='4')?`<span class="pill o" style="margin-left:6px">제${esc(q.round)}회 · 문제${padNum(roundQNumber(q)||(n+1))}</span>`:'';
      const chapterBadge6=(q.category==='6')?`<span class="pill o" style="margin-left:6px">${esc(chapterTitleFmt(q.chapter))} · 문제${padNum(cat6QNumber(q)||(n+1))}</span>`:'';
      const cat5Badge=(q.category==='5'&&q.direct)?`<span class="pill g" style="margin-left:6px">직접 응시</span>`:'';
      const cat5ResultPrefix=(q.category==='5')?`문제 ${cat5QNumber(q)||(n+1)}번. `:'';
      return `
      <div style="padding:10px 0;border-bottom:1px solid var(--line)">
        <div class="row"><b style="font-size:13px">${n+1}. ${d.correct?'<span style="color:var(--ok)">⭕ 정답</span>':'<span style="color:var(--no)">❌ 오답</span>'}</b>${resultStars}${roundBadge}${chapterBadge6}${cat5Badge}</div>
        <div class="muted" style="font-size:12.5px;white-space:pre-wrap;margin:4px 0">${cat5ResultPrefix}${esc(q.q)}</div>
        ${q.qimg?`<img class="qimg" src="${q.qimg}">`:''}
        ${(type==='short'&&d.correct)
          ?`<div style="font-size:13px">내 답: <b>${myLabel}</b></div>`
          :`<div style="font-size:13px">내 답: <b>${myLabel}</b> / 정답: <b style="color:var(--ok)">${okLabel}</b></div>`}
        ${(q.exp||q.eimg)?`<div class="exp">💡 ${fmtExp(q.exp)}${q.eimg?`<img src="${q.eimg}">`:''}</div>`:''}
      </div>`}).join('')}</div>
  <button class="btn full" onclick="exam=null;examCat=null;go('exam')">새 시험 보기</button>`;}

let mFilter={cat:'',freq:'',region:'',kw:''};

const M_PER_PAGE=20;

      <select id="mg_freq" onchange="mFilter.freq=this.value;mPage=0;renderManage()">

      </select>
      <select id="mg_region" onchange="mFilter.region=this.value;mPage=0;renderManage()"><option value="">지역</option></select>

  btns+=`<button class="btn sm sec" onclick="goPage(${totalPages-1})" ${mPage===totalPages-1?'disabled':''}>▶▶</button>`;

}

function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  const d=new Date();const ts=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href=url;a.download=`도로교통법규_문제은행_${ts}.json`;a.click();URL.revokeObjectURL(url);}
function importData(input){const f=input.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{try{
    const arr=JSON.parse(e.target.result);
    if(!Array.isArray(arr)||!arr.length||arr[0].q===undefined)throw 0;
    if(!confirm(`${arr.length}문항을 가져옵니다. 현재 문제은행을 교체할까요?\n(현재 ${DB.length}문항은 사라집니다)`))return;
    arr.forEach(q=>{q.qimg=q.qimg||'';q.eimg=q.eimg||'';if(!q.category)q.category='1';if(!q.type)q.type=q.category==='2'?'ox':q.category==='3'?'short':'mc';});
    DB=arr;saveDB();renderManage();alert('가져오기 완료.');
  }catch(err){alert('올바른 문제은행 JSON 파일이 아닙니다.');}};
  r.readAsText(f);input.value='';}

function wrapMark(id,mark){
  const ta=document.getElementById(id);if(!ta)return;
  const s=ta.selectionStart,e=ta.selectionEnd,val=ta.value;
  const sel=val.slice(s,e);
  ta.value=val.slice(0,s)+mark+sel+mark+val.slice(e);
  const pos=sel?s+mark.length+sel.length+mark.length:s+mark.length;
  ta.focus();ta.setSelectionRange(pos,pos);
}

function paintImgBox(key){
  const box = $('#' + key + 'box');
  if(!box) return;
  const has = editBuf[key];
  box.className = 'imgbox';
  box.innerHTML = `${has ? `<img src="${has}">` : '<div class="muted" style="margin-bottom:8px">📎 첨부된 이미지 없음 — 아래 버튼으로 선택</div>'}
    <input type="file" accept="image/*" onchange="loadImg(this,'${key}')">
    ${has ? `<button class="btn sm dang" style="margin-top:8px" onclick="clearImg('${key}')">이미지 삭제</button>` : ''}`;
}

function loadImg(input,key){const f=input.files[0];if(!f)return;
  if(f.size>2*1024*1024){if(!confirm('이미지가 2MB를 넘습니다. 계속할까요?')){input.value='';return;}}
  const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');let w=img.width,h=img.height;const M=900;
    if(w>M){h=Math.round(h*M/w);w=M;}c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    editBuf[key]=c.toDataURL('image/jpeg',0.85);paintImgBox(key);

function saveQ(id,cat){
  const g = s => {
    const el = $('#' + s);
    return el ? el.value : '';
  };

  let obj;
  if(cat==='2'){
    obj = { category:'2', type:'ox', freq:+g('e_freq'), region:'', year:'', unit:'',
      q:g('e_q'), choices:['','','',''], answer:+g('e_ans'),
      exp:g('e_exp'), review:g('e_review'), qimg:editBuf.qimg||'', eimg:editBuf.eimg||'' };
  } else if(cat==='3'){
    const chapter=g('e_chapter')||'1';
    const answerArr=editShortAnswers.map(a=>String(a||'').trim()).filter(a=>a.length>0);
    obj = { category:'3', type:'short', freq:2, region:'', year:'', chapter, unit:chapterLabel(chapter),
      q:g('e_q'), choices:['','','',''], answer:answerArr.length?answerArr:[''],
      exp:g('e_exp'), review:g('e_review'), qimg:editBuf.qimg||'', eimg:editBuf.eimg||'' };
  } else if(cat==='4'){
    const exDiff=+g('e_exDiff')||2;
    obj = { category:'4', type:'mc', round:g('e_round')||'1', exIndex:+g('e_exIndex')||2, exDiff,
      freq:exDiff, region:'', year:'', unit:'', part:g('e_part'),
      q:g('e_q'), choices:[g('e_c0'), g('e_c1'), g('e_c2'), g('e_c3')], answer:+g('e_ans'),
      exp:g('e_exp'), review:g('e_review'), qimg:editBuf.qimg||'', eimg:editBuf.eimg||'' };
  } else if(cat==='6'){
    const exDiff6=+g('e_exDiff')||2;
    const chapter6=g('e_chapter')||'1';
    obj = { category:'6', type:'mc', chapter:chapter6, unit:chapterLabel(chapter6), exIndex:+g('e_exIndex')||2, exDiff:exDiff6,
      freq:exDiff6, region:'', year:'', part:g('e_part'),
      q:g('e_q'), choices:[g('e_c0'), g('e_c1'), g('e_c2'), g('e_c3')], answer:+g('e_ans'),
      exp:g('e_exp'), review:g('e_review'), qimg:editBuf.qimg||'', eimg:editBuf.eimg||'' };
  } else if(cat==='5'){
    const directEl=$('#e_direct');
    obj = { category:'5', type:'mc', freq:2, region:normalizeRegion(g('e_region')), year:g('e_year'), unit:'',
      direct: directEl ? !!directEl.checked : false,
      q:g('e_q'), choices:[g('e_c0'), g('e_c1'), g('e_c2'), g('e_c3')], answer:+g('e_ans'),
      exp:g('e_exp'), review:g('e_review'), qimg:editBuf.qimg||'', eimg:editBuf.eimg||'' };
  } else {
    obj = { category:cat, type:'mc', freq:+g('e_freq'), region:normalizeRegion(g('e_region')), year:g('e_year'), unit:'',
      q:g('e_q'), choices:[g('e_c0'), g('e_c1'), g('e_c2'), g('e_c3')], answer:+g('e_ans'),
      exp:g('e_exp'), review:g('e_review'), qimg:editBuf.qimg||'', eimg:editBuf.eimg||'' };
  }

  let resultId;
  if(id !== null && id !== undefined){
    const idx = DB.findIndex(x => x.id === id);
    if(idx !== -1) DB[idx] = Object.assign({id}, obj);
    resultId = id;
  } else {
    obj.id = DB.length ? Math.max(...DB.map(x => x.id)) + 1 : 1;
    DB.push(obj);
    resultId = obj.id;
  }

  saveDB();
  renderManage();
  return resultId;
}

let parsedCache=[];
function parseBlocks(text,parser){
  parser = parser || parseOne;
  const lines=text.split('\n');
  const blocks=[];let cur=[];
  for(let raw of lines){const line=raw.trim();
    if(line==='###'||/^문제\s*\d+\s*$/.test(line)){if(cur.length){blocks.push(cur);cur=[];}continue;}
    cur.push(raw);}
  if(cur.length)blocks.push(cur);
  const out=[];for(const b of blocks){const q=parser(b);if(q)out.push(q);}return out;}

function parseOne(blockLines){
  let freq=2,region='',year='',qtext=[],choices=[],answer=1,exp=[],mode='head';
  const cmap={'①':1,'②':2,'③':3,'④':4};
  const diffMap={'하':1,'중':2,'상':3,'하급':1,'중급':2,'상급':3};
  for(let raw of blockLines){let line=raw.trim();if(!line)continue;
    // 신형식: 난이도 / 출제년도 / 출제지역 라벨
    if(/^난이도(\s*\(.*?\))?\s*[:：]/.test(line)){
      const v=line.replace(/^난이도(\s*\(.*?\))?\s*[:：]\s*/,'').trim();
      if(diffMap[v])freq=diffMap[v];
      else{const s=(v.match(/★/g)||[]).length;if(s>=1&&s<=3)freq=s;}
      continue;
    }
    if(/^출제년도\s*[:：]/.test(line)){
      const v=line.replace(/^출제년도\s*[:：]\s*/,'').trim();
      const toks=(v.match(/\d{2,4}/g)||[]);
      const ys=toks.map(t=>t.length===4?t:t.length===2?'20'+t:null).filter(Boolean);
      if(ys.length)year=[...new Set(ys)].join(',');
      continue;
    }
    if(/^출제지역\s*[:：]/.test(line)){region=normalizeRegion(line.replace(/^출제지역\s*[:：]\s*/,'').trim());continue;}
    // 신형식: 단독 라벨 줄("문제"/"정답"/"해설")
    if(line==='문제'){mode='head';continue;}
    if(line==='정답'){mode='answer';continue;}
    if(line==='해설'){mode='exp';continue;}
    if(mode==='answer'){const c=line.match(/[①②③④]/);const n=line.match(/^([1-4])/);
      if(c)answer=cmap[c[0]];else if(n)answer=parseInt(n[1]);mode='post-answer';continue;}
    // 구형식: 출제빈도 ★★★
    if(/출제빈도|통제빈도|둘째반도|돌파비드/.test(line)||/^[★☆]+$/.test(line)){
      const s=(line.match(/★/g)||[]).length;if(s)freq=s;continue;}
    if(/^\d{1,3}$/.test(line))continue;
    // 구형식: "2014,2016. 교육청·서울" 한 줄 표기
    let ym=line.match(/^(20\d{2}[\d,\s·]*)[.\,]\s*(.+)$/);
    if(ym&&mode==='head'){year=ym[1].replace(/\s/g,'');region=normalizeRegion(ym[2].replace(/[\[\(].*?[\]\)]/g,'').trim());continue;}
    // 구형식: 정답: 4
    let am=line.match(/^정답\s*[:：]\s*([①②③④1-4])/);
    if(am){const c=am[1];answer=cmap[c]||parseInt(c);mode='exp';continue;}
    // 구형식: 해설: ...
    if(/^해설\s*[:：]/.test(line)){exp.push(line.replace(/^해설\s*[:：]\s*/,''));mode='exp';continue;}
    if(mode==='head'||mode==='choice'){
      let cm=line.match(/^([①②③④])\s*(.*)$/)||line.match(/^([1-4])[\)\.]\s*(.*)$/);
      if(cm){choices.push(cm[2]);mode='choice';continue;}
    }
    if(mode==='exp')exp.push(line);
    else if(mode==='post-answer'){/* 정답과 해설 라벨 사이의 여분 줄은 무시 */}
    else{qtext.push(line);mode='head';}}
  if(!qtext.length||choices.length<2)return null;
  while(choices.length<4)choices.push('');
  return {freq,region,year,q:qtext.join('\n'),choices:choices.slice(0,4),answer,exp:exp.join('\n'),review:'',qimg:'',eimg:''};}

// 카테고리4(실전모의고사) 전용 파서: "문제 NN" 다음 줄에서 회차를 인식하고,
// 해설 뒤에 오는 출제지수/출제난도/출제파트를 별도 필드로 분리한다.
function parseOneMC4(blockLines){
  let round='',qtext=[],choices=[],answer=1,exp=[],exIndex=2,exDiff=2,part='',mode='pre';
  const cmap={'①':1,'②':2,'③':3,'④':4};
  const diffMap={'하':1,'중':2,'상':3,'하급':1,'중급':2,'상급':3};
  function parseStar(v){
    if(diffMap[v]!=null)return diffMap[v];
    const s=(v.match(/★/g)||[]).length;
    return (s>=1&&s<=3)?s:null;
  }
  for(let raw of blockLines){let line=raw.trim();if(!line)continue;
    // "문제" 라벨이 나오기 전(=회차 표기 줄): 제1회 모의고사 / 1회 / 모고1 / 제1회 / 1 모두 인식
    if(mode==='pre'){
      const rm=line.match(/^제?\s*(\d{1,2})\s*회(?:\s*모의고사)?\s*$/) || line.match(/^모고\s*(\d{1,2})\s*$/i) || line.match(/^(\d{1,2})\s*$/);
      if(rm){round=String(parseInt(rm[1],10));continue;}
    }
    if(line==='문제'){mode='head';continue;}
    if(line==='정답'){mode='answer';continue;}
    if(line==='해설'){mode='exp';continue;}
    if(/^출제지수(\s*\(.*?\))?\s*[:：]/.test(line)){
      const v=line.replace(/^출제지수(\s*\(.*?\))?\s*[:：]\s*/,'').trim();
      const p=parseStar(v);if(p)exIndex=p;mode='meta';continue;
    }
    if(/^출제난도(\s*\(.*?\))?\s*[:：]/.test(line)){
      const v=line.replace(/^출제난도(\s*\(.*?\))?\s*[:：]\s*/,'').trim();
      const p=parseStar(v);if(p)exDiff=p;mode='meta';continue;
    }
    if(/^출제파트\s*[:：]/.test(line)){part=line.replace(/^출제파트\s*[:：]\s*/,'').trim();mode='part';continue;}
    if(mode==='answer'){const c=line.match(/[①②③④]/);const n=line.match(/^([1-4])/);
      if(c)answer=cmap[c[0]];else if(n)answer=parseInt(n[1]);mode='post-answer';continue;}
    if(mode==='head'||mode==='choice'){
      let cm=line.match(/^([①②③④])\s*(.*)$/)||line.match(/^([1-4])[\)\.]\s*(.*)$/);
      if(cm){choices.push(cm[2]);mode='choice';continue;}
    }
    if(mode==='part'){part+=(part?'\n':'')+line;continue;}
    if(mode==='exp'){exp.push(line);continue;}
    else if(mode==='post-answer'||mode==='meta'||mode==='pre'){/* 라벨 사이의 여분 줄/미인식 회차줄은 무시 */continue;}
    else{qtext.push(line);mode='head';}
  }
  if(!qtext.length||choices.length<2)return null;
  while(choices.length<4)choices.push('');
  return {round,q:qtext.join('\n'),choices:choices.slice(0,4),answer,exp:exp.join('\n'),exIndex,exDiff,part,review:'',qimg:'',eimg:''};
}

  }
  for(let raw of blockLines){let line=raw.trim();if(!line)continue;
    // "문제" 라벨이 나오기 전(=챕터 표기 줄): Chapter.1 / Chapter1 / chapter1 / 챕터1 / 챕터.1 모두 인식
    if(mode==='pre'){
      const cm=line.match(/^(?:chapter|챕터)\.?\s*(\d{1,2})\b/i);
      if(cm){const n=parseInt(cm[1],10);if(n>=1&&n<=13)chapter=String(n);continue;}
    }
    if(line==='문제'){mode='head';continue;}
    if(line==='정답'){mode='answer';continue;}
    if(line==='해설'){mode='exp';continue;}
    if(/^출제지수(\s*\(.*?\))?\s*[:：]/.test(line)){
      const v=line.replace(/^출제지수(\s*\(.*?\))?\s*[:：]\s*/,'').trim();
      const p=parseStar(v);if(p)exIndex=p;mode='meta';continue;
    }
    if(/^출제난도(\s*\(.*?\))?\s*[:：]/.test(line)){
      const v=line.replace(/^출제난도(\s*\(.*?\))?\s*[:：]\s*/,'').trim();
      const p=parseStar(v);if(p)exDiff=p;mode='meta';continue;
    }
    if(/^출제파트\s*[:：]/.test(line)){part=line.replace(/^출제파트\s*[:：]\s*/,'').trim();mode='part';continue;}
    if(mode==='answer'){const c=line.match(/[①②③④]/);const n=line.match(/^([1-4])/);
      if(c)answer=cmap[c[0]];else if(n)answer=parseInt(n[1]);mode='post-answer';continue;}
    if(mode==='head'||mode==='choice'){
      let cm=line.match(/^([①②③④])\s*(.*)$/)||line.match(/^([1-4])[\)\.]\s*(.*)$/);
      if(cm){choices.push(cm[2]);mode='choice';continue;}
    }
    if(mode==='part'){part+=(part?'\n':'')+line;continue;}
    if(mode==='exp'){exp.push(line);continue;}
    else if(mode==='post-answer'||mode==='meta'||mode==='pre'){/* 라벨 사이의 여분 줄/미인식 챕터줄은 무시 */continue;}
    else{qtext.push(line);mode='head';}
  }
  if(!qtext.length||choices.length<2)return null;
  while(choices.length<4)choices.push('');
  return {chapter,q:qtext.join('\n'),choices:choices.slice(0,4),answer,exp:exp.join('\n'),exIndex,exDiff,part,review:'',qimg:'',eimg:''};
}

function isOtext(v){return /^(o|○|참|true)/i.test(String(v||'').trim());}

function parseOneOX(blockLines){
  let freq=2,qtext=[],answer=1,exp=[],mode='head';
  const diffMap={'하':1,'중':2,'상':3,'하급':1,'중급':2,'상급':3};
  for(let raw of blockLines){let line=raw.trim();if(!line)continue;
    if(/^난이도(\s*\(.*?\))?\s*[:：]/.test(line)){const v=line.replace(/^난이도(\s*\(.*?\))?\s*[:：]\s*/,'').trim();
      if(diffMap[v])freq=diffMap[v];
      else{const s=(v.match(/★/g)||[]).length;if(s>=1&&s<=3)freq=s;}
      continue;}
    if(line==='문제'){mode='q';continue;}
    if(line==='정답'){mode='a';continue;}
    if(line==='해설'){mode='e';continue;} // 해설 라벨이 있으면 계속 지원(선택사항)
    if(/^정답\s*[:：]/.test(line)){const v=line.replace(/^정답\s*[:：]\s*/,'').trim();answer=isOtext(v)?1:2;mode='done';continue;}
    if(mode==='a'){answer=isOtext(line)?1:2;mode='done';continue;}
    if(mode==='e'){exp.push(line);continue;}
    if(mode==='done')continue; // 정답 다음에 해설 라벨 없이 남는 줄은 무시(신형식)
    qtext.push(line);mode='q';
  }
  if(!qtext.length)return null;
  return {freq,q:qtext.join('\n'),answer,exp:exp.join('\n'),qimg:'',eimg:'',review:''};
}

function parseOneShort(blockLines){
  let chapter='',qtext=[],answerLines=[],exp=[],mode='head';
  for(let raw of blockLines){let line=raw.trim();if(!line)continue;
    // "Chapter.1", "Chapter1", "chapter 1", "챕터1", "챕터.1" 등 숫자만 맞으면 인식 (뒤에 [ 제목 ]이 붙어도 무시하고 숫자만 사용)
    const cm=line.match(/^(?:chapter|챕터)\.?\s*(\d{1,2})\b/i);
    if(cm){const n=parseInt(cm[1],10);if(n>=1&&n<=13)chapter=String(n);continue;}
    if(line==='문제'){mode='q';continue;}
    if(line==='정답'){mode='a';continue;}
    if(line==='해설'){mode='e';continue;} // 구형식 호환(선택)
    if(/^정답\s*[:：]/.test(line)){answerLines.push(line.replace(/^정답\s*[:：]\s*/,''));mode='a';continue;}
    if(mode==='a'){answerLines.push(line);continue;} // ⓐⓑⓒ 등 여러 줄 계속 수집
    if(mode==='e'){exp.push(line);continue;}
    qtext.push(line);mode='q';
  }
  if(!qtext.length||!answerLines.length)return null;
  // ⓐⓑⓒ... 로 시작하는 줄이 있으면 정답칸을 여러 개로 분리, 없으면 단일 정답(여러 줄이면 합쳐서 하나로)
  const markerLines=answerLines.filter(l=>/^[ⓐ-ⓩ]/.test(l));
  let answer;
  if(markerLines.length){
    answer=markerLines.map(l=>l.replace(/^[ⓐ-ⓩ]\s*/,'').trim()).filter(l=>l.length>0);
    if(!answer.length)answer=[answerLines.join(' ').trim()];
  }else{
    answer=[answerLines.join(' ').trim()];
  }
  return {chapter,unit:chapter?chapterLabel(chapter):'',q:qtext.join('\n'),answer,exp:exp.join('\n'),qimg:'',eimg:'',review:''};
}

function previewParse(){const t=$('#paste')?$('#paste').value:'';
  if(addCat==='2'){parsedCache=parseBlocks(t,parseOneOX).map(q=>Object.assign({category:'2',type:'ox'},q));}
  else if(addCat==='3'){parsedCache=parseBlocks(t,parseOneShort).map(q=>Object.assign({category:'3',type:'short'},q));}
  else if(addCat==='4'){parsedCache=parseBlocks(t,parseOneMC4).map(q=>Object.assign({category:'4',type:'mc'},q));}
  else if(addCat==='5'){parsedCache=parseBlocks(t,parseOneCat5).map(q=>Object.assign({category:'5',type:'mc'},q));}
  else if(addCat==='6'){parsedCache=parseBlocks(t,parseOneMC6).map(q=>Object.assign({category:'6',type:'mc'},q));}
  else{parsedCache=parseBlocks(t,parseOne).map(q=>Object.assign({category:addCat,type:'mc'},q));}
  const el=$('#prev');if(!el)return;
  if(!parsedCache.length){el.innerHTML='<div class="muted">인식된 문제 없음</div>';return;}
  // 챕터별 다음 번호(이미 저장된 문제 수 + 이번에 새로 추가되는 순번)를 미리 계산
  const chCounter={};
  // 카테고리5(23-25 기출문제)는 추가된 순서 그대로 문제 번호가 매겨짐: 기존 저장분 다음 번호부터 이어서 계산
  let cat5Counter=DB.filter(x=>x.category==='5').length;
  el.innerHTML=`<div style="font-weight:700;margin-bottom:6px">✅ 인식된 문제: ${parsedCache.length}개</div>`+
    parsedCache.map(q=>{
      if(q.type==='ox'){
        return `<div class="card" style="margin-bottom:8px;padding:10px">
          <div class="qmeta"><span class="stars">${STAR(q.freq)}</span></div>
          <div style="font-size:13px;font-weight:600;white-space:pre-wrap">${esc(q.q)}</div>
          <div class="muted" style="font-size:12px">정답 ${q.answer===1?'O':'X'}</div></div>`;
      } else if(q.type==='short'){
        const chLabel=q.chapter?esc(chapterFullLabel(q.chapter)):'<span style="color:var(--no)">⚠ 챕터 미인식</span>';
        const aArr=toAnswerArray(q.answer);
        const ansLine=aArr.length>1?aArr.map((a,k)=>ansMark(k)+' '+esc(a)).join(' / '):esc(aArr[0]||'');
        let qPrefix='';
        if(q.chapter){
          if(chCounter[q.chapter]==null)chCounter[q.chapter]=DB.filter(x=>x.category==='3'&&String(x.chapter)===q.chapter).length;
          chCounter[q.chapter]++;
          qPrefix=padNum(chCounter[q.chapter])+'. ';
        }
        return `<div class="card" style="margin-bottom:8px;padding:10px">
          <div class="qmeta"><span class="pill o">${chLabel}</span></div>
          <div style="font-size:13px;font-weight:600;white-space:pre-wrap">${qPrefix}${esc(q.q)}</div>
          <div class="muted" style="font-size:12px">정답 ${ansLine}</div></div>`;
      }
      if(q.category==='4'){
        return `<div class="card" style="margin-bottom:8px;padding:10px">
        <div class="qmeta tags"><span class="pill o">${q.round?`제${esc(q.round)}회`:'<span style=\"color:var(--no)\">⚠ 회차 미인식</span>'}</span><span class="stars" title="출제지수">${STAR(q.exIndex)}</span><span class="stars" title="출제난도">${STAR(q.exDiff)}</span>${q.part?`<span class="pill p">${esc(q.part)}</span>`:''}</div>
        <div style="font-size:13px;font-weight:600;white-space:pre-wrap">${esc(q.q)}</div>
        <div class="muted" style="font-size:12px">정답 ${q.answer}. ${esc(q.choices[q.answer-1]||'')}</div></div>`;
      }
      if(q.category==='6'){
        return `<div class="card" style="margin-bottom:8px;padding:10px">
        <div class="qmeta tags"><span class="pill o">${q.chapter?esc(chapterTitleFmt(q.chapter)):'<span style=\"color:var(--no)\">⚠ 챕터 미인식</span>'}</span><span class="stars" title="출제지수">${STAR(q.exIndex)}</span><span class="stars" title="출제난도">${STAR(q.exDiff)}</span>${q.part?`<span class="pill p">${esc(q.part)}</span>`:''}</div>
        <div style="font-size:13px;font-weight:600;white-space:pre-wrap">${esc(q.q)}</div>
        <div class="muted" style="font-size:12px">정답 ${q.answer}. ${esc(q.choices[q.answer-1]||'')}</div></div>`;
      }
      if(q.category==='5'){
        cat5Counter++;
        return `<div class="card" style="margin-bottom:8px;padding:10px">
        <div class="qmeta tags"><span class="pill c">문제 ${padNum(cat5Counter)}</span> ${splitYears(q.year).map(y=>`<span class="pill p">${y}</span>`).join('')||'<span class="pill p">연도?</span>'} ${splitRegions(q.region).map(r=>`<span class="pill o">${esc(r)}</span>`).join('')||'<span class="pill o">지역?</span>'} ${q.direct?'<span class="pill g">직접 응시</span>':''}</div>
        <div style="font-size:13px;font-weight:600;white-space:pre-wrap">${esc(q.q)}</div>
        <div class="muted" style="font-size:12px">정답 ${q.answer}. ${esc(q.choices[q.answer-1]||'')}</div></div>`;
      }
      return `<div class="card" style="margin-bottom:8px;padding:10px">
      <div class="qmeta tags"><span class="stars">${STAR(q.freq)}</span> ${splitRegions(q.region).map(r=>`<span class="pill o">${esc(r)}</span>`).join('')||'<span class="pill o">지역?</span>'} ${splitYears(q.year).map(y=>`<span class="pill p">${y}</span>`).join('')||'<span class="pill p">연도?</span>'}</div>
      <div style="font-size:13px;font-weight:600;white-space:pre-wrap">${esc(q.q)}</div>
      <div class="muted" style="font-size:12px">정답 ${q.answer}. ${esc(q.choices[q.answer-1]||'')}</div></div>`;
    }).join('');}

function commitAdd(){if(!parsedCache.length){alert('추가할 문제가 없습니다. 형식을 확인하세요.');return;}
  if(!confirm(`${parsedCache.length}개 문제를 추가할까요?`))return;
  let nid=Math.max(0,...DB.map(x=>x.id));
  parsedCache.forEach(q=>{q.id=++nid;DB.push(q);});
  saveDB();alert(`${parsedCache.length}개 추가됨. (총 ${DB.length}문항)`);TAB='manage';renderNav();render();}

function renderStats(){if(!HIST.length){$('#view').innerHTML='<div class="card center muted">아직 응시 기록이 없습니다.<br>시험에 응시하면 통계가 표시됩니다.</div>';return;}
  const scores=HIST.map(h=>h.score);const myAvg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  const best=Math.max(...scores);const last=HIST[0];
  const pr=peers(last.setKey).concat([last.score]).sort((a,b)=>b-a);
  const avg=Math.round(pr.reduce((a,b)=>a+b,0)/pr.length);const rank=pr.indexOf(last.score)+1;
  const byDiff={};HIST.forEach(h=>h.detail.forEach(d=>{const q=DB.find(x=>x.id===d.id);if(!q)return;const k=q.freq;byDiff[k]=byDiff[k]||{c:0,t:0};byDiff[k].t++;if(d.correct)byDiff[k].c++;}));
  const diffLabel={3:'상 ★★★',2:'중 ★★☆',1:'하 ★☆☆'};
  $('#view').innerHTML=`
  <div class="card"><h3>📊 최근 시험 경쟁 현황</h3>
    <div class="stat-grid" style="margin-top:10px">
      <div class="stat-box"><div class="v">${pr.length}명</div><div class="l">응시 인원</div></div>
      <div class="stat-box"><div class="v">${avg}점</div><div class="l">평균 점수</div></div>
      <div class="stat-box"><div class="v">${rank}위</div><div class="l">나의 순위</div></div>
      <div class="stat-box"><div class="v">${last.score}점</div><div class="l">나의 점수</div></div></div></div>
  <div class="card"><h3>🏆 나의 성적</h3>
    <div class="row" style="margin:8px 0"><span class="muted">평균 점수</span><b>${myAvg}점</b></div>
    <div class="row" style="margin:8px 0"><span class="muted">최고 점수</span><b style="color:var(--ok)">${best}점</b></div>
    <div class="row" style="margin:8px 0"><span class="muted">총 응시 횟수</span><b>${HIST.length}회</b></div></div>
  <div class="card"><h3>📚 난이도별 정답률</h3>
    ${[3,2,1].filter(k=>byDiff[k]).map(k=>{const v=byDiff[k];const p=Math.round(v.c/v.t*100);return `
      <div style="margin:10px 0"><div class="row"><span style="font-size:13px">${diffLabel[k]}</span><b>${p}% (${v.c}/${v.t})</b></div>
      <div class="bar"><i style="width:${p}%;background:${p>=70?'var(--ok)':p>=50?'#f59e0b':'var(--no)'}"></i></div></div>`}).join('')}</div>`;}

function renderHist(){if(!HIST.length){$('#view').innerHTML='<div class="card center muted">응시 이력이 없습니다.</div>';return;}
  $('#view').innerHTML=`
  <div class="card"><div class="row" style="margin-bottom:10px"><h3>🗂 응시 이력 (${HIST.length}회)</h3>${ROLE==='admin'?'<button class="btn sm dang" onclick="if(confirm(\'모든 이력을 삭제할까요?\')){HIST=[];saveHist();renderHist();}">전체삭제</button>':''}</div>
    <table><tr><th>일시</th><th>점수</th><th>정답</th><th>소요</th><th>순위</th></tr>
      ${HIST.map(h=>{const pr=peers(h.setKey).concat([h.score]).sort((a,b)=>b-a);const rk=pr.indexOf(h.score)+1;return `
        <tr><td style="font-size:11px">${h.date.replace(/:\d+$/,'')}</td><td><b>${h.score}</b></td><td>${h.correct}/${h.total}</td><td>${Math.floor(h.sec/60)}:${String(h.sec%60).padStart(2,'0')}</td><td>${rk}/${pr.length}</td></tr>`}).join('')}
    </table></div>
  <div class="note">📈 점수 추이: ${HIST.slice(0,10).reverse().map(h=>h.score).join(' → ')}</div>`;}

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function attr(s){return esc(s).replace(/"/g,'&quot;');}
// 해설 텍스트의 **굵게**, __밑줄__ 표시를 안전하게 HTML로 변환 (먼저 escape 후 마커만 태그로 치환)
function fmtExp(s){
  return esc(s)
    .replace(/\*\*([\s\S]+?)\*\*/g,'<b>$1</b>')
    .replace(/__([\s\S]+?)__/g,'<u>$1</u>');
}
// 모달 바깥(배경) 클릭으로는 닫히지 않음 - 반드시 X 또는 [닫기] 버튼을 눌러야 닫힘
async function loadQuestions(){
  // 문제 데이터를 불러오는 순서:
  // 1) IndexedDB에 저장된 데이터가 있으면 그것을 사용 (현재 방식, 용량 한도가 커서 안전함)
  // 2) 없다면, 예전 버전에서 localStorage에 저장해 두었던 데이터가 있는지 확인해 그대로 이어받고 IndexedDB로 옮겨 저장
  // 3) 그것도 없을 때(=정말 최초 실행)만 traffic_question.json 초기 문제 파일을 불러온다.
  // (이렇게 해야 문제추가/문제관리에서 새로 입력한 문제가 다음 접속 때 사라지지 않는다)
  let hasSavedDB = false;
  try{
    const idbDB = await idbGet('qdb_traffic_v1');
    if(idbDB !== undefined){
      DB = Array.isArray(idbDB) ? idbDB : [];
      hasSavedDB = true;
    }
  }catch(e){
    console.error('IndexedDB 읽기 실패, localStorage 방식으로 대체 확인합니다:', e);
  }

  if(!hasSavedDB){
    const oldRaw = localStorage.getItem('qdb_traffic_v1');
    if(oldRaw!=null){
      try{
        const oldDB = JSON.parse(oldRaw);
        DB = Array.isArray(oldDB) ? oldDB : [];
        hasSavedDB = true;
        await saveDB(); // 앞으로는 IndexedDB에 저장되도록 이관
      }catch(e){ /* 손상된 데이터면 무시하고 최초 실행으로 처리 */ }
    }
  }

  if(!hasSavedDB){
    try{
      const res = await fetch("traffic_question.json?v=" + Date.now());
      const data = await res.json();
      if(Array.isArray(data) && data.length){
        DB = data;
        await saveDB();
      }
    }catch(e){
      console.log(e);
    }
  }

  migrateDB();
  renderNav();
  render();
}

loadQuestions();
</script>
